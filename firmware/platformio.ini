; PlatformIO project for the RowLog firmware.
; Builds the .cpp/.h files in RowLog/, the same files the Arduino IDE compiles, so there is one
; copy of the code. Open this "firmware" folder in VS Code with the PlatformIO extension
; (or run `pio run` here).

[platformio]
src_dir = RowLog
default_envs = rowlog

[env:rowlog]
; pioarduino platform: Arduino core 3.3.2 for the ESP32-C3 (the official platformio
; espressif32 platform only offers core 2.x, which this sketch does not build with)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; Arduino IDE equivalents: "USB CDC On Boot: Enabled", "Partition Scheme: Default"
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default.csv

; OLED library (only needed with ENABLE_OLED 1), pinned to the tested version
lib_deps =
    https://github.com/olikraus/U8g2_Arduino.git#2.37.1

monitor_speed = 115200
; show crash backtraces with function names and line numbers in the serial monitor
monitor_filters = esp32_exception_decoder, time
